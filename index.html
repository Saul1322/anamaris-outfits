<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anamari's Outfits | CatÃ¡logo</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        /* Aviso visible si algo falla (ayuda a encontrar errores en el celular) */
        window.onerror = function (mensaje, archivo, linea) {
            var aviso = document.getElementById('avisoError');
            if (!aviso) {
                aviso = document.createElement('div');
                aviso.id = 'avisoError';
                aviso.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:12px/1.4 sans-serif;padding:8px 12px;';
                (document.body || document.documentElement).appendChild(aviso);
            }
            aviso.textContent += (aviso.textContent ? ' | ' : '') + mensaje + ' (lÃ­nea ' + linea + ')';
        };

        /* Foto que no existe: se muestra un recuadro con el cÃ³digo */
        document.addEventListener('error', function (e) {
            var img = e.target;
            if (!img || img.tagName !== 'IMG') return;
            var tarjeta = img.closest ? img.closest('.product-card[data-category="lenceria"]') : null;
            if (!tarjeta || !img.parentNode) return;
            var caja = document.createElement('div');
            caja.className = 'sin-foto';
            caja.textContent = (img.getAttribute('alt') || '').replace('LencerÃ­a ', '');
            img.parentNode.replaceChild(caja, img);
        }, true);

        /* ---------- MenÃº y categorÃ­as ---------- */
        window.categoriaActual = 'inicio';
        function abrirMenu() {
            var menu = document.getElementById('sideMenu');
            var overlay = document.getElementById('menuOverlay');
            if (menu && overlay) {
                menu.classList.add('open');
                overlay.classList.add('show');
            }
        }

        function cerrarMenu() {
            var menu = document.getElementById('sideMenu');
            var overlay = document.getElementById('menuOverlay');
            if (menu && overlay) {
                menu.classList.remove('open');
                overlay.classList.remove('show');
            }
        }

        function irInicio() {
            var botonInicio = document.querySelector('.cat-link');
            cambiarVista('inicio', 'PÃ¡gina Principal', botonInicio);
        }

        /* Cambia la visibilidad solo si el elemento existe */
        function mostrar(elemento, valor) {
            if (elemento) { elemento.style.display = valor; }
        }

        function cambiarVista(categoria, nombreCategoria, botonPresionado) {
            window.categoriaActual = categoria;
            var botones = document.querySelectorAll('.cat-link');
            for (var i = 0; i < botones.length; i++) {
                botones[i].classList.remove('active');
            }
            if (botonPresionado) {
                botonPresionado.classList.add('active');
            }

            var seccionInicio = document.getElementById('seccionInicio');
            var seccionRedes = document.getElementById('seccionRedes');
            var titulo = document.getElementById('tituloCategoria');
            var productos = document.querySelectorAll('.product-card');

            if (categoria === 'inicio') {
                mostrar(seccionInicio, 'block');
                mostrar(seccionRedes, 'block');
                if (titulo) titulo.textContent = 'Destacados';
                for (var j = 0; j < productos.length; j++) {
                    productos[j].style.display = (j === 0) ? 'flex' : 'none';
                }
            } else {
                mostrar(seccionInicio, 'none');
                mostrar(seccionRedes, 'none');
                if (titulo) titulo.textContent = 'CategorÃ­a: ' + nombreCategoria;
                for (var k = 0; k < productos.length; k++) {
                    if (productos[k].getAttribute('data-category') === categoria) {
                        productos[k].style.display = 'flex';
                    } else {
                        productos[k].style.display = 'none';
                    }
                }
            }

            cerrarMenu();
            window.scrollTo(0, 0);
        }

        window.onload = function() {
            var productos = document.querySelectorAll('.product-card');
            for (var i = 0; i < productos.length; i++) {
                productos[i].style.display = (i === 0) ? 'flex' : 'none';
            }
        };

        /* Disponibles para los botones aunque el visualizador aÃ­sle los scripts */
        window.abrirMenu = abrirMenu;
        window.cerrarMenu = cerrarMenu;
        window.irInicio = irInicio;
        window.cambiarVista = cambiarVista;


        /* ---------- Carrito de compras ---------- */
        var CLAVE_CARRITO = 'anamariCarrito';
        var NUMERO_PEDIDOS = '593998724301';
        var carrito = [];
        var temporizadorAviso = null;

        function guardarCarrito() {
            try { localStorage.setItem(CLAVE_CARRITO, JSON.stringify(carrito)); } catch (e) {}
        }

        function recuperarCarrito() {
            try {
                var datos = localStorage.getItem(CLAVE_CARRITO);
                if (datos) {
                    var lista = JSON.parse(datos);
                    if (lista && lista.length !== undefined) carrito = lista;
                }
            } catch (e) { carrito = []; }
        }

        function dinero(n) { return '$' + n.toFixed(2); }

        function escapar(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function precioDeTexto(texto) {
            var s = String(texto || '').replace(/[^0-9.,]/g, '');
            if (!s) return null;
            if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
            var n = parseFloat(s);
            return isNaN(n) ? null : n;
        }

        function abrirCarrito() {
            if (typeof cerrarMenu === 'function') cerrarMenu();
            var d = document.getElementById('cartDrawer');
            var o = document.getElementById('cartOverlay');
            if (d && o) { d.classList.add('open'); o.classList.add('show'); }
        }

        function cerrarCarrito() {
            var d = document.getElementById('cartDrawer');
            var o = document.getElementById('cartOverlay');
            if (d && o) { d.classList.remove('open'); o.classList.remove('show'); }
        }

        function mostrarAviso(texto) {
            var a = document.getElementById('cartToast');
            if (!a) return;
            a.textContent = texto;
            a.classList.add('show');
            clearTimeout(temporizadorAviso);
            temporizadorAviso = setTimeout(function () { a.classList.remove('show'); }, 1600);
        }

        function agregarAlCarrito(tarjeta) {
            var tituloEl = tarjeta.querySelector('.product-title');
            var catEl = tarjeta.querySelector('.product-category');
            var precioEl = tarjeta.querySelector('.product-price');
            var imgEl = tarjeta.querySelector('.product-image img');
            var titulo = tituloEl ? tituloEl.textContent.trim() : '';
            var categoria = catEl ? catEl.textContent.trim() : '';
            var precio = precioEl ? precioDeTexto(precioEl.textContent) : null;
            if (!titulo || precio === null) return;

            /* Si la prenda tiene tallas disponibles, hay que elegir una */
            var disponibles = tarjeta.querySelectorAll('.size-tag:not(.sin-stock)');
            var elegida = tarjeta.querySelector('.size-tag.selected');
            var talla = elegida ? elegida.textContent.trim() : '';
            if (disponibles.length && !talla) {
                var zona = tarjeta.querySelector('.product-sizes');
                if (zona) {
                    zona.classList.remove('pide-talla');
                    void zona.offsetWidth;
                    zona.classList.add('pide-talla');
                    setTimeout(function () { zona.classList.remove('pide-talla'); }, 900);
                }
                mostrarAviso('Elige una talla primero');
                return;
            }

            var id = categoria + '|' + titulo + '|' + talla;
            var encontrado = false;
            for (var i = 0; i < carrito.length; i++) {
                if (carrito[i].id === id) { carrito[i].cantidad += 1; encontrado = true; break; }
            }
            if (!encontrado) {
                carrito.push({ id: id, titulo: titulo, categoria: categoria, talla: talla, precio: precio,
                               img: imgEl ? imgEl.getAttribute('src') : '', cantidad: 1 });
            }
            guardarCarrito();
            dibujarCarrito();
            mostrarAviso('AÃ±adido: ' + titulo + (talla ? ' - ' + talla : ''));
            var fab = document.getElementById('cartFab');
            if (fab) { fab.classList.remove('bump'); void fab.offsetWidth; fab.classList.add('bump'); }
        }

        /* Elegir (o quitar) la talla de una tarjeta */
        function seleccionarTalla(etiqueta) {
            if (etiqueta.classList.contains('sin-stock')) return;
            var tarjeta = etiqueta.closest('.product-card');
            if (!tarjeta) return;
            var yaEstaba = etiqueta.classList.contains('selected');
            var todas = tarjeta.querySelectorAll('.size-tag');
            for (var i = 0; i < todas.length; i++) {
                todas[i].classList.remove('selected');
                todas[i].setAttribute('aria-pressed', 'false');
            }
            if (!yaEstaba) {
                etiqueta.classList.add('selected');
                etiqueta.setAttribute('aria-pressed', 'true');
            }
        }

        function cambiarCantidad(indice, cambio) {
            if (!carrito[indice]) return;
            carrito[indice].cantidad += cambio;
            if (carrito[indice].cantidad < 1) carrito.splice(indice, 1);
            guardarCarrito();
            dibujarCarrito();
        }

        function quitarDelCarrito(indice) {
            carrito.splice(indice, 1);
            guardarCarrito();
            dibujarCarrito();
        }

        function vaciarCarrito() {
            carrito = [];
            guardarCarrito();
            dibujarCarrito();
        }

        function dibujarCarrito() {
            var lista = document.getElementById('cartItems');
            var pie = document.getElementById('cartFooter');
            var contador = document.getElementById('cartCount');
            var totalEl = document.getElementById('cartTotal');
            var pedido = document.getElementById('cartOrder');
            if (!lista) return;

            var total = 0, unidades = 0, html = '', mensaje = 'Â¡Hola! Quiero hacer este pedido:\n\n';
            for (var i = 0; i < carrito.length; i++) {
                var it = carrito[i];
                var sub = it.precio * it.cantidad;
                total += sub; unidades += it.cantidad;
                mensaje += 'â€¢ ' + it.cantidad + ' x ' + it.titulo + (it.talla ? ' - ' + it.talla : '') + ' (' + it.categoria + ') â€“ ' + dinero(sub) + '\n';
                html += '<div class="cart-item">' +
                    '<div class="cart-thumb">' + (it.img ? '<img src="' + escapar(it.img) + '" alt="">' : '') + '</div>' +
                    '<div class="cart-info">' +
                        '<span class="cart-name">' + escapar(it.titulo + (it.talla ? ' - ' + it.talla : '')) + '</span>' +
                        '<span class="cart-cat">' + escapar(it.categoria) + ' Â· ' + dinero(it.precio) + '</span>' +
                        '<div class="cart-qty">' +
                            '<button type="button" data-accion="menos" data-i="' + i + '" aria-label="Quitar una unidad">âˆ’</button>' +
                            '<span>' + it.cantidad + '</span>' +
                            '<button type="button" data-accion="mas" data-i="' + i + '" aria-label="AÃ±adir una unidad">+</button>' +
                        '</div>' +
                    '</div>' +
                    '<div class="cart-side">' +
                        '<button type="button" class="cart-remove" data-accion="quitar" data-i="' + i + '" aria-label="Quitar del carrito">&times;</button>' +
                        '<span class="cart-sub">' + dinero(sub) + '</span>' +
                    '</div>' +
                '</div>';
            }
            mensaje += '\nTotal: ' + dinero(total);

            if (!carrito.length) {
                html = '<div class="cart-empty"><p><strong>Tu carrito estÃ¡ vacÃ­o</strong></p>' +
                       '<p>Toca el botÃ³n del carrito en una prenda para aÃ±adirla.</p>' +
                       '<button type="button" class="btn-primary" onclick="cerrarCarrito()">Seguir viendo</button></div>';
            }
            lista.innerHTML = html;
            if (pie) pie.style.display = carrito.length ? 'block' : 'none';
            if (totalEl) totalEl.textContent = dinero(total);
            if (pedido) pedido.href = 'https://wa.me/' + NUMERO_PEDIDOS + '?text=' + encodeURIComponent(mensaje);
            if (contador) {
                contador.textContent = unidades > 99 ? '99+' : unidades;
                contador.style.display = unidades ? 'flex' : 'none';
            }
        }

        /* Pone el botÃ³n "aÃ±adir" en cada tarjeta que tenga precio y stock */
        function prepararBotonesCarrito() {
            var etiquetas = document.querySelectorAll('.size-tag');
            for (var e = 0; e < etiquetas.length; e++) {
                etiquetas[e].setAttribute('role', 'button');
                if (etiquetas[e].classList.contains('sin-stock')) {
                    etiquetas[e].setAttribute('aria-disabled', 'true');
                } else {
                    etiquetas[e].setAttribute('tabindex', '0');
                    if (!etiquetas[e].hasAttribute('aria-pressed')) etiquetas[e].setAttribute('aria-pressed', 'false');
                }
            }

            var tarjetas = document.querySelectorAll('.product-card');
            for (var i = 0; i < tarjetas.length; i++) {
                var t = tarjetas[i];
                if (t.querySelector('.btn-add') || t.classList.contains('agotado')) continue;
                var pie = t.querySelector('.product-footer');
                var precioEl = t.querySelector('.product-price');
                if (!pie || !precioEl) continue;
                var comprar = pie.querySelector('.btn-buy');

                /* Sin precio no se puede sumar al total: queda un botÃ³n para consultar por WhatsApp */
                if (precioDeTexto(precioEl.textContent) === null) {
                    if (comprar && comprar.tagName === 'A') comprar.textContent = 'Consultar';
                    continue;
                }

                /* Un solo botÃ³n por prenda: sustituye a "Lo quiero" y aÃ±ade al carrito */
                var boton = document.createElement('button');
                boton.type = 'button';
                boton.className = 'btn-add';
                boton.setAttribute('aria-label', 'AÃ±adir al carrito');
                boton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/><path d="M2 3h3l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L20.5 7H6"/><path d="M13 9v4M11 11h4"/></svg><span>AÃ±adir</span>';
                if (comprar) { pie.replaceChild(boton, comprar); } else { pie.appendChild(boton); }
            }
        }

        document.addEventListener('click', function (e) {
            var objetivo = e.target;
            if (!objetivo || !objetivo.closest) return;
            var etiqueta = objetivo.closest('.size-tag');
            if (etiqueta) { seleccionarTalla(etiqueta); return; }
            var add = objetivo.closest('.btn-add');
            if (add) {
                var tarjeta = add.closest('.product-card');
                if (tarjeta) agregarAlCarrito(tarjeta);
                return;
            }
            var accion = objetivo.closest('[data-accion]');
            if (accion) {
                var i = parseInt(accion.getAttribute('data-i'), 10);
                var que = accion.getAttribute('data-accion');
                if (que === 'mas') cambiarCantidad(i, 1);
                else if (que === 'menos') cambiarCantidad(i, -1);
                else if (que === 'quitar') quitarDelCarrito(i);
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') cerrarCarrito();
            if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('size-tag')) {
                e.preventDefault();
                seleccionarTalla(e.target);
            }
        });

        function iniciarCarrito() {
            recuperarCarrito();
            prepararBotonesCarrito();
            dibujarCarrito();
            var grid = document.querySelector('.catalog-grid');
            if (grid && window.MutationObserver) {
                new MutationObserver(prepararBotonesCarrito).observe(grid, { childList: true });
            }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarCarrito);
        else iniciarCarrito();

        window.abrirCarrito = abrirCarrito;
        window.cerrarCarrito = cerrarCarrito;
        window.vaciarCarrito = vaciarCarrito;
    </script>
</head>
<body>

    <!-- Barra Superior Fija -->
    <div class="top-bar">
        <button type="button" class="menu-btn" onclick="abrirMenu()">â˜° CategorÃ­as</button>
        
        <!-- Regresa a la pÃ¡gina principal -->
        <div class="top-brand" onclick="irInicio()">
            <span class="top-bar-title">Anamari's Outfits</span>
            <img src="1001170987.jpg" alt="Logo miniatura" class="top-mini-logo">
        </div>
    </div>

    <!-- Fondo oscuro al abrir el menÃº -->
    <div class="menu-overlay" id="menuOverlay" onclick="cerrarMenu()"></div>

    <!-- MenÃº Lateral Desplegable -->
    <aside class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <h2>MenÃº</h2>
            <button type="button" class="close-btn" onclick="cerrarMenu()">&times;</button>
        </div>
        <nav class="side-menu-links">
            <button type="button" class="cat-link active" onclick="cambiarVista('inicio', 'PÃ¡gina Principal', this)">ðŸ  PÃ¡gina Principal</button>
            <button type="button" class="cat-link" onclick="cambiarVista('mujer', 'Mujer', this)">Mujer</button>
            <button type="button" class="cat-link" onclick="cambiarVista('carteritas', 'Carteritas', this)">Carteritas</button>
            <button type="button" class="cat-link" onclick="cambiarVista('lenceria', 'LencerÃ­a', this)">LencerÃ­a</button>
            <button type="button" class="cat-link" onclick="cambiarVista('bebe', 'BebÃ©', this)">BebÃ©</button>
            <button type="button" class="cat-link" onclick="cambiarVista('nina', 'NiÃ±a', this)">NiÃ±a</button>
        </nav>
    </aside>

    <!-- SECCIÃ“N PÃGINA PRINCIPAL -->
    <div id="seccionInicio">
        <header class="header">
            <div class="container header-content">
                <img src="1001170987.jpg" alt="Logo Anamari's Outfits" class="logo">
                <h1 class="brand-name">Anamari's Outfits</h1>
                <p class="slogan">Tu estilo, tu esencia, tu <strong>outfit.</strong></p>
                <span class="subtitle">â€¢ MODA & ACCESORIOS â€¢</span>
            </div>
        </header>

        <section class="hero">
